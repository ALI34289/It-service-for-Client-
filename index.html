<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Service Sales Lead Form</title>
    <style>
        /* Basic Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        /* Form Container */
        .form-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; /* Important */
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="file"]:focus,
        select:focus,
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        input[type="file"] {
            background-color: #ffffff;
        }

        input[type="file"]::file-selector-button {
            padding: 12px 15px;
            margin: -12px 8px -12px -12px;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            border-top-left-radius: 5px;
            border-bottom-left-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #2980b9;
        }

        /* Placeholder styling */
        ::placeholder {
            color: #95a5a6;
        }

        /* Submit Button */
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #2980b9;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .form-container {
                margin: 20px auto;
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>IT Service Sales Lead</h1>
        <!--
            Form Submission Note:
            This form is configured to work with Formspree, a free service for handling form submissions.
            To make it work, you need to:
            1. Create a new form on formspree.io.
            2. Get your unique Formspree URL (e.g., https://formspree.io/f/your-unique-id).
            3. Replace the placeholder URL in the `action` attribute of the <form> tag below with your unique URL.
        -->
        <form action="https://formspree.io/f/your-unique-id" method="POST" id="lead-form">
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="fullName" placeholder="e.g., John Doe" required>
            </div>
            <div class="form-group">
                <label for="agent-ref-id">Agent Reference ID</label>
                <input type="text" id="agent-ref-id" name="agentRefId" placeholder="e.g., AGENT12345">
            </div>
            <div class="form-group">
                <label for="designation">Designation/Role</label>
                <input type="text" id="designation" name="designation" placeholder="e.g., IT Manager" required>
            </div>
            <div class="form-group">
                <label for="business-name">Business Name</label>
                <input type="text" id="business-name" name="businessName" placeholder="e.g., Innovate Corp" required>
            </div>
            <div class="form-group">
                <label for="business-address">Business Address</label>
                <input type="text" id="business-address" name="businessAddress" placeholder="e.g., 123 Tech Street, Silicon Valley, CA" required>
            </div>
            <div class="form-group">
                <label for="phone-number">Phone Number</label>
                <input type="tel" id="phone-number" name="phoneNumber" placeholder="e.g., (123) 456-7890" required>
            </div>
            <div class="form-group">
                <label for="email">Email ID</label>
                <input type="email" id="email" name="email" placeholder="e.g., john.doe@example.com" required>
            </div>
            <div class="form-group">
                <label for="business-type">Type of Business</label>
                <select id="business-type" name="businessType" required>
                    <option value="" disabled selected>Select your business type</option>
                    <option value="technology">Technology</option>
                    <option value="healthcare">Healthcare</option>
                    <option value="finance">Finance</option>
                    <option value="education">Education</option>
                    <option value="retail">Retail</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="current-tools">Current IT/Software Tools</label>
                <textarea id="current-tools" name="currentTools" placeholder="List any relevant IT or software tools your business currently uses."></textarea>
            </div>
            <div class="form-group">
                <label for="interested-services">Interested Services</label>
                <select id="interested-services" name="interestedServices" required>
                    <option value="" disabled selected>Select a service</option>
                    <option value="digital-marketing">Digital Marketing</option>
                    <option value="web-development">Web Development</option>
                    <option value="app-development">App Development</option>
                    <option value="software-development">Software Development</option>
                    <option value="ui-ux-design">UX/UI Design</option>
                </select>
            </div>
            <div class="form-group">
                <label for="budget-readiness">Budget Readiness</label>
                <select id="budget-readiness" name="budgetReadiness" required>
                    <option value="" disabled selected>Select budget status</option>
                    <option value="ready">Budget Approved</option>
                    <option value="planning">Planning/Approval Phase</option>
                    <option value="exploring">Exploring Options</option>
                </select>
            </div>
            <div class="form-group">
                <label for="timeline">Timeline to Implement</label>
                <select id="timeline" name="timeline" required>
                    <option value="" disabled selected>Select a timeline</option>
                    <option value="0-3">0-3 Months</option>
                    <option value="3-6">3-6 Months</option>
                    <option value="6-12">6-12 Months</option>
                    <option value="12+">12+ Months</option>
                </select>
            </div>
            <div class="form-group">
                <label for="payment-screenshot">Payment Screenshot</label>
                <input type="file" id="payment-screenshot" name="paymentScreenshot" accept="image/*">
            </div>
            <div class="form-group">
                <label for="additional-notes">Additional Notes</label>
                <textarea id="additional-notes" name="additionalNotes" placeholder="Any other information you'd like to share?"></textarea>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <!--
        JavaScript can be added here for form validation or to handle form submission
        asynchronously (e.g., using fetch to send data to the backend without a page reload).
    -->
    <script>
        // Example: You could add JavaScript to handle form submission
        // document.getElementById('lead-form').addEventListener('submit', function(event) {
        //     event.preventDefault(); // Prevent default form submission
        //     console.log('Form submitted!');
        //     // Add your data submission logic here (e.g., using fetch)
        // });
    </script>

</body>
</html>
